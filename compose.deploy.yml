# The deployed product on the university VM. Staging and production are two copies of this
# file, each run as its own compose project with its own env file; see docs/deployment.md.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      # Verification emails go to this deployment's own Mailpit inbox, on MAIL_PORT.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
      APP_URL: ${APP_URL:?}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:?}:80"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:?}:8025"

volumes:
  db-data:
