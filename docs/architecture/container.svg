<svg xmlns="http://www.w3.org/2000/svg" width="950" height="560" viewBox="0 0 950 560" role="img" aria-labelledby="title desc">
<title id="title">Sentence Cards container view</title><desc id="desc">Frontend calls backend and LLM provider. Backend calls database, LLM provider, email provider, OpenPanel, and OpenObserve.</desc>
