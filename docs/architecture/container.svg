<rect width="950" height="560" fill="#fbfcff"/>
<g fill="none" stroke="#53627a" stroke-width="2" marker-end="url(#arrow)">
<path d="M220 105 H374"/><path d="M575 105 H735"/><path d="M130 150 V323 H215"/><path d="M475 150 V323 H215"/><path d="M530 150 V240 H725"/><path d="M570 130 H625 V332 H725"/><path d="M530 135 H590 V430 H725"/>
