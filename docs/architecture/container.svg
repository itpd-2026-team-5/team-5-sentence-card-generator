<rect x="725" y="210" width="200" height="75" rx="12" fill="#f9f9fb" stroke="#596c9d" stroke-width="2" stroke-dasharray="7 5"/><text x="825" y="243" font-weight="bold">email provider</text><text x="825" y="263">SMTP</text>
<rect x="725" y="305" width="200" height="75" rx="12" fill="#f9f9fb" stroke="#596c9d" stroke-width="2" stroke-dasharray="7 5"/><text x="825" y="338" font-weight="bold">OpenPanel</text><text x="825" y="358">analytics backend</text>
