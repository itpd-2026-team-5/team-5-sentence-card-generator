name: Task
description: Create a new unit of work (Task)
title: "<Title of your task>"
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the unit of work to be done.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What needs to be done for this task to be considered complete?
      value: "- [ ] AC-01: "
    validations:
      required: true

  - type: textarea
    id: story
    attributes:
      label: Story
      description: |
        List the story issues this task works toward as a bullet list.
        Example:
        - #42 (AC-01, AC-02)
        Leave empty if this is a standalone task (e.g., workflow setup).
    validations:
      required: false
